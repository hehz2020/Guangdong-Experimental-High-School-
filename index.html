<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>广东实验中学 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; overflow: hidden; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  canvas { display: block; }
  [hidden] { display: none !important; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #dfe6ee; background: #10141a; font-size: 18px; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(12, 16, 22, 0.55); color: #eef2f6; cursor: pointer; text-align: center; padding: 16px; box-sizing: border-box; }
  #start h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; }
  #start .sub { margin: 0 0 18px; font-size: 14px; opacity: 0.8; }
  #start-how { margin: 0 0 14px; font-size: 18px; }
  #start .keys { margin: 0; font-size: 14px; line-height: 1.9; opacity: 0.9; }
  #notice { position: fixed; left: 10px; bottom: 10px; max-width: calc(100% - 20px); box-sizing: border-box; padding: 5px 9px; border-radius: 4px; background: rgba(12, 16, 22, 0.7); color: #ffd98a; font-size: 12px; line-height: 1.5; pointer-events: none; }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<div id="loading">加载中…</div>
<div id="start" hidden>
  <div>
    <h1>广东实验中学 · 校园漫游</h1>
    <p class="sub">开发中</p>
    <p id="start-how">点击画面开始</p>
    <p class="keys">W A S D 或方向键：移动　　鼠标：转向<br>Shift：跑　　Esc：释放鼠标</p>
  </div>
</div>
<div id="notice" hidden>开发中：目前是按卫星图量出的建筑体块，高度由视频中的层数估算，并非实测；外立面与室内尚未完成。</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
